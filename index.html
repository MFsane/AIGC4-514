  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__left">
        <button class="icon-btn mobile-menu-btn" id="mobileMenuButton" aria-label="打开导航菜单" aria-expanded="false">
          <svg class="icon"><use href="#i-menu"></use></svg>
        </button>
        <span class="topbar__date" id="topbarDate">11月19日 周四</span>
      </div>
      <a class="brand" href="#overview" aria-label="HDU 日程表首页">
        <img class="brand__logo" src="assets/logo.svg" alt="" width="38" height="38">
        <span class="brand__text">
          <strong>HDU 日程表</strong>
          <small>AI 校园时间规划</small>
        </span>
      </a>
      <div class="topbar__right">
        <button class="icon-btn notification-btn" data-page="notifications" aria-label="通知中心">
          <svg class="icon"><use href="#i-bell"></use></svg>
          <span class="notification-dot" id="notificationDot" hidden></span>
        </button>
        <button class="login-btn" id="accountButton" aria-haspopup="true" aria-expanded="false">登录</button>
      </div>
    </header>

    <div class="layout">
      <div class="sidebar-scrim" id="sidebarScrim" hidden></div>
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="sidebar__inner">
          <div class="sidebar__scroll">
            <p class="nav-label">工作台</p>
            <nav class="nav-list">
              <button class="nav-item" data-page="overview"><svg class="icon"><use href="#i-grid"></use></svg><span>今日概览</span></button>
              <button class="nav-item" data-page="schedule"><svg class="icon"><use href="#i-calendar"></use></svg><span>日程表</span><span class="nav-count" id="scheduleCount">0</span></button>
              <button class="nav-item" data-page="tasks"><svg class="icon"><use href="#i-check-square"></use></svg><span>我的任务</span><span class="nav-count" id="taskCount">0</span></button>
              <button class="nav-item" data-page="stats"><svg class="icon"><use href="#i-chart"></use></svg><span>数据统计</span></button>
              <button class="nav-item" data-page="themes"><svg class="icon"><use href="#i-palette"></use></svg><span>主题更换</span></button>
              <button class="nav-item" data-page="leisure"><svg class="icon"><use href="#i-coffee"></use></svg><span>休闲时间</span></button>
            </nav>

            <p class="nav-label nav-label--more">快捷入口</p>
            <nav class="utility-list">
              <button class="utility-item" data-page="notifications"><svg class="icon"><use href="#i-bell"></use></svg><span>通知中心</span><span class="utility-dot" id="sidebarNotifDot" hidden></span></button>
              <button class="utility-item" data-page="profile"><svg class="icon"><use href="#i-user"></use></svg><span>个人中心</span></button>
              <button class="utility-item" data-page="help"><svg class="icon"><use href="#i-help"></use></svg><span>帮助与反馈</span></button>
              <button class="utility-item" data-page="about"><svg class="icon"><use href="#i-shield"></use></svg><span>关于与合规</span></button>
            </nav>

            <button class="ai-launch" data-action="open-ai">
              <span class="ai-launch__icon"><svg class="icon"><use href="#i-sparkles"></use></svg></span>
              <span class="ai-launch__copy"><strong>AI 智能排版</strong><small>把任务放进空课时间</small></span>
              <span class="ai-launch__arrow"><svg class="icon"><use href="#i-arrow-right"></use></svg></span>
            </button>

          </div>

        </div>
      </aside>

      <main class="main" id="main">
        <div class="page" id="page"></div>
        <footer class="app-footer">
          <div class="app-footer__brand">
            <img src="assets/logo.svg" alt="" width="22" height="22">
            <span><strong>HDU 日程表</strong> · 把零散任务，放进恰好的空课时间。</span>
          </div>
          <div class="app-footer__links">
            <button data-page="sources" class="source-link"><svg class="icon"><use href="#i-database"></use></svg>信息来源</button>
            <button data-page="about">AI 使用说明</button>
            <button data-page="about">隐私与安全</button>
          </div>
          <p class="app-footer__copy">课程竞赛演示原型 · 数据默认保存在本机 · 同步课表时仅请求 HDUHELP · © 2026 HDU Schedule · www.myhduschedule.com</p>
        </footer>
      </main>

    <button class="mascot__figure" data-action="mascot" aria-label="和奶娃助手互动">
      <span class="mascot__tag">奶娃</span>
      <img class="mascot-img" src="assets/naiwa.png" alt="奶娃，黄色圆润的 AI 二创表情包形象">
      <span class="mascot__ground"></span>
    </button>
